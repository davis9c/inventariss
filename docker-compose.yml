# Seluruh konfigurasi aplikasi berasal dari berkas .env di root repo.
# Berkas itu ter-bind-mount ke dalam container, jadi isinya dipakai apa adanya
# oleh container maupun oleh server pengembangan (php -S).
#
# Yang TIDAK ada di sini:
#   - service database. Tidak ada container MySQL, tidak ada volume db-data,
#     dan tidak ada depends_on. MySQL dijalankan di luar Docker.
#   - override konfigurasi lewat environment variable. Dulu ada, tapi hanya
#     untuk mengalahkan .env yang menunjuk database dev -- dan saat itu masih
#     ada service db. Sekarang justru dikehendaki agar .env yang menang, jadi
#     tidak ada satu pun nilai app.* atau database.* di blok environment.
#
# Konsekuensi yang perlu diketahui: selama .env menunjuk dev_inventaris,
# container dan server pengembangan BERBAGAI satu database. Entrypoint
# menjalankan migrate + seed setiap start -- keduanya idempoten, jadi tidak
# menghapus dan tidak mengalikan baris -- tapi perubahan dari salah satu akan
# terlihat di yang lain. Kalau ingin terpisah, cukup ubah
# database.default.database di .env (mis. ke db_am_inventaris); compose tidak
# perlu disentuh.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventaris-app
    ports:
      # host:port di dalam container. Ganti angka pertama kalau live server
      # memakai port lain, atau dibiarkan seperti ini di belakang reverse
      # proxy.
      - "${APP_PORT:-8082}:80"
