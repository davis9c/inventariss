services:
  # ─── Web Application ─────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventaris-app
    restart: unless-stopped
    ports:
      - "8092:80"
    volumes:
      - .:/var/www/html
      - app-writable:/var/www/html/writable
    environment:
      - CI_ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inventaris

  # ─── MySQL Database ──────────────────────────────
  db:
    image: mysql:8.0
    container_name: inventaris-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: inventaris
      MYSQL_USER: inventaris
      MYSQL_PASSWORD: inventaris_secret
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventaris

volumes:
  db-data:
  app-writable:

networks:
  inventaris:
    driver: bridge
