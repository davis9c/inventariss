; Berlaku untuk CLI (php spark) maupun web (mod_php), karena keduanya membaca
; file .ini di PHP_INI_SCAN_DIR. Dipasang sebagai auto_prepend_file supaya
; container-env.php sempat mengisi $_ENV sebelum CodeIgniter membaca .env
; milik host yang ter-bind-mount.
;
; Kenapa tidak cukup pakai environment variable biasa: Docker membuang nama
; environment variable yang mengandung titik, sedangkan hanya bentuk titik
; yang dibaca CodeIgniter lebih dulu. Lihat docker/container-env.php.
auto_prepend_file = /usr/local/share/container-env.php
